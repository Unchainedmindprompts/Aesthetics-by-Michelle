<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decorative colored glass</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="glass" aria-hidden="true"></canvas>
<script type="module">
let app;
try {
  const { Application } = await import("https://unpkg.com/@splinetool/runtime@2.0.76/build/runtime.js");
  app = new Application(document.getElementById("glass"));
  await app.load("https://prod.spline.design/QLSpTUfQslL3xRXh/scene.splinecode");
  parent.postMessage({type:"michelle-glass-ready"}, location.origin);
} catch {
  parent.postMessage({type:"michelle-glass-error"}, location.origin);
}
addEventListener("pagehide",()=>app?.dispose());
</script></body></html>
