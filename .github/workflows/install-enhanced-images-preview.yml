name: Install enhanced 4K skincare and studio images in preview
on:
  push:
    branches:
      - preview/michelle-spa-editorial-20261111
    paths:
      - .github/workflows/install-enhanced-images-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
      - name: Download, validate, and optimize four enhanced images
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import io, json, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps

          sources = json.loads("{\"public/images/editorial/ringana-collection-4k.webp\":\"https://dnznrvs05pmza.cloudfront.net/magnific_precision_upscaler_v2/bfde56d5-55e8-4bdc-867c-fbffd09277e1/bfde56d5-55e8-4bdc-867c-fbffd09277e1.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmM2N2UyYTU1NjU4ZTVlOSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDY3OTMzM30.rLh42k6PBcwi5REcRb2EV9kThXaNIy5PbrtWW-OQvKU\",\"public/images/editorial/elliemd-serum-4k.webp\":\"https://dnznrvs05pmza.cloudfront.net/magnific_precision_upscaler_v2/e8c580ed-d5fd-4d1b-96a2-e37bfa24b222/e8c580ed-d5fd-4d1b-96a2-e37bfa24b222.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGJiOWQwYWMyOGI3NzQ1YiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDc0Mzk4MH0.KmuSv_IrZR2lUwhaLjnOBdb77ThGEZAJAhe9BJY2U-E\",\"public/images/editorial/zo-skincare-collection-4k.webp\":\"https://dnznrvs05pmza.cloudfront.net/magnific_precision_upscaler_v2/4260e71e-568a-498f-ae39-41c9c585c907/4260e71e-568a-498f-ae39-41c9c585c907.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODJmMzYwMjM3MWUwNTAwZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDcwOTUzOX0.px-KWZc49wSgJnSO0K8vPP-DQYuwy9a2cv1Mzwsnru4\",\"public/images/michelle-studio-4k.webp\":\"https://dnznrvs05pmza.cloudfront.net/magnific_precision_upscaler_v2/de4b990a-4154-42f1-a0c1-df74f2f50cf0/de4b990a-4154-42f1-a0c1-df74f2f50cf0.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGUxYzY4MTYyZjgzOGE2MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDc1NjUwMn0.1I3raBKMwnk8pE2tsX5WH2OO3L-fmIHPFgEQMf6MoJE\"}")
          expected_names = {
              "ringana-collection-4k.webp", "elliemd-serum-4k.webp",
              "zo-skincare-collection-4k.webp", "michelle-studio-4k.webp",
          }
          if {Path(p).name for p in sources} != expected_names:
              raise SystemExit("Expected image assets mismatch")
          for path_text, url in sources.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  payload = response.read()
              if len(payload) < 25000:
                  raise RuntimeError("Unexpectedly small image: " + path_text)
              with Image.open(io.BytesIO(payload)) as source:
                  image = ImageOps.exif_transpose(source).convert("RGB")
              source_size = image.size
              # Keep the original aspect ratio. 3840px on the long edge is
              # true 4K-class image dimensions, with no stretch or crop.
              width, height = image.size
              max_side = max(width, height)
              if max_side != 3840:
                  scale = 3840 / max_side
                  image = image.resize(
                      (round(width * scale), round(height * scale)),
                      Image.Resampling.LANCZOS,
                  )
              dest = Path(path_text)
              dest.parent.mkdir(parents=True, exist_ok=True)
              image.save(dest, "WEBP", quality=91, method=5)
              with Image.open(dest) as test:
                  assert max(test.size) == 3840, (dest, test.size)
                  assert min(test.size) >= 1400, (dest, test.size)
              print("FOUR_K_IMAGE", dest, "source", source_size,
                    "final", image.size, "bytes", dest.stat().st_size,
                    flush=True)
          PY
      - name: Commit permanent 4K images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial/ringana-collection-4k.webp public/images/editorial/elliemd-serum-4k.webp public/images/editorial/zo-skincare-collection-4k.webp public/images/michelle-studio-4k.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add four permanent 4K enhanced skincare images"
            git push
          fi
