name: Create mobile hero photo from approved 4K desktop hero
on:
  push:
    branches:
      - preview/michelle-spa-editorial-20261111
    paths:
      - .github/workflows/create-mobile-hero-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop-mobile-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview
        uses: actions/checkout@v4
      - name: Crop the photo-only right side of the 4K hero
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source = Path("public/images/editorial/hero.webp")
          target = Path("public/images/editorial/hero-mobile.webp")
          with Image.open(source) as photo:
              image = ImageOps.exif_transpose(photo).convert("RGB")
          w,h=image.size
          if w < 2500 or h < 1500:
              raise SystemExit(f"Hero dimensions unexpected: {image.size}")
          # Keep the right-side skincare still life, excluding the screenshot's
          # embedded brand navigation, desktop heading, and appointment button.
          bounds=(round(w*.41),round(h*.373),round(w*.998),round(h*.985))
          crop=image.crop(bounds)
          crop.save(target,"WEBP",quality=90,method=6)
          with Image.open(target) as verify:
              assert verify.width >= 1500 and verify.height >= 700
              print("MOBILE_HERO_SOURCE",image.size,flush=True)
              print("MOBILE_HERO_CROP",bounds,flush=True)
              print("MOBILE_HERO_RESULT",verify.size,target.stat().st_size,flush=True)
          PY
      - name: Commit mobile hero asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial/hero-mobile.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add cropped desktop 4K hero photo for mobile"
            git push
          fi
