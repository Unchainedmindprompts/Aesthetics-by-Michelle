name: Import editorial preview imagery
on:
  push:
    branches:
      - preview/michelle-spa-editorial-20261111
    paths:
      - .github/workflows/import-spa-preview-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-spa-imagery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Download and optimize the approved imagery
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          import io
          import json
          import re
          import urllib.request
          from pathlib import Path
          from PIL import Image

          route = Path("app/editorial-media/[name]/route.ts").read_text()
          match = re.search(r"const assets: Record<string, string> = (\{.*?\});", route, re.S)
          if not match:
              raise SystemExit("Image manifest missing; no changes made")
          assets = json.loads(match.group(1))
          expected = {"hero", "microneedling", "facials", "chemical-peels", "brow-lash", "waxing", "reiki"}
          if set(assets) != expected:
              raise SystemExit("Unexpected assets; no changes made")
          output = Path("public/images/editorial")
          output.mkdir(parents=True, exist_ok=True)
          for name, url in assets.items():
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload = response.read()
              if len(payload) < 2000:
                  raise SystemExit(f"Suspiciously small asset: {name}")
              with Image.open(io.BytesIO(payload)) as image:
                  rgb = image.convert("RGB")
                  target_width = 1600 if name == "hero" else 1200
                  if rgb.width > target_width:
                      height = round(rgb.height * target_width / rgb.width)
                      rgb = rgb.resize((target_width, height), Image.Resampling.LANCZOS)
                  rgb.save(output / f"{name}.webp", "WEBP", quality=84, method=6)
              print(name, (output / f"{name}.webp").stat().st_size)
          PY
      - name: Commit stable preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/editorial/
          if ! git diff --cached --quiet; then
            git commit -m "Bundle all seven spa images for reliable preview delivery"
            git push
          fi
